# VIX75 platform Redis - local dev config
# Tuned for signal bus + hot cache workloads.

bind 0.0.0.0
# Compose-internal service + host binding is 127.0.0.1 only, so remote
# clients are trusted containers on `vixnet`. Protected mode would deny
# them (no password by design in dev); production adds a requirepass.
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence: AOF for durability of signal streams across restarts.
appendonly yes
appendfilename "vix75.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory ceiling (container is small in dev; raise on Oracle ARM).
maxmemory 512mb
maxmemory-policy noeviction

# Slowlog visibility for the audit trail.
slowlog-log-slower-than 10000
slowlog-max-len 256

# Keyspace notifications for pub/sub consumers.
notify-keyspace-events ""
