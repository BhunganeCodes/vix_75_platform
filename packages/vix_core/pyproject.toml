[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vix-core"
version = "0.1.0"
description = "Shared domain library for the VIX75 microservices platform"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "structlog>=24.4,<26",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "numpy>=2.0,<3",
    "prometheus_client>=0.20,<1",
    "scipy>=1.13",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.hatch.build.targets.wheel]
packages = ["vix_core"]
