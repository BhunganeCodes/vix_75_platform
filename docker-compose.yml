# =====================================================================
#  VIX75 Platform - local development orchestration
#
#  NETWORK SECURITY MODEL (Sprint 5):
#    * Only api-gateway, prometheus, grafana publish host ports.
#    * Internal services are reachable ONLY via the `vixnet` aliases
#      (service DNS name :8000) - no host port bindings.
#    * Postgres/Redis bind to 127.0.0.1 so the LOCAL Windows MT5 bridge
#      can reach them without exposing them to the network.
#
#  Usage:  docker compose up -d timescaledb redis
#          docker compose --profile services up -d
# =====================================================================

name: vix75-platform

networks:
  vixnet:
    driver: bridge

volumes:
  timescale_data:
  redis_data:

services:
  # ------------------------------------------------------------------
  # Infrastructure (loopback-only host bindings)
  # ------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: vix-timescaledb
    environment:
      POSTGRES_USER: vix
      POSTGRES_PASSWORD: vix_dev_password        # local dev only
      POSTGRES_DB: vix75
    command: postgres -c shared_preload_libraries=timescaledb
    ports:
      - "127.0.0.1:15432:5432"   # host 5432 often taken by a native Postgres - override here
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescale/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vix -d vix75"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vixnet]

  redis:
    image: redis:7-alpine
    container_name: vix-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:16379:6379"   # host 6379 may conflict with a native Redis
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vixnet]

  # ------------------------------------------------------------------
  # Observability stack
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vix-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [vixnet]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: vix-grafana
    environment:
      GF_SECURITY_ADMIN_USER: vix-admin            # local dev only
      GF_SECURITY_ADMIN_PASSWORD: vix_dev_password # rotate in prod
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [vixnet]

  # ------------------------------------------------------------------
  # Services - internal network ONLY (no host ports)
  # ------------------------------------------------------------------
  data-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: data-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  feature-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: feature-service
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: ml-service
        PIP_EXTRA: "hmmlearn lightgbm scikit-learn"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./models:/app/models
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  signal-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: signal-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  risk-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: risk-service
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  execution-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: execution-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  notify-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: notify-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  visualization-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: visualization-service
    environment:
      DATABASE_URL: postgresql://vix:vix_dev_password@timescaledb:5432/vix75
      REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks: [vixnet]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
    ports:
      - "8000:8000"                                 # the ONLY public edge
    depends_on:
      redis:
        condition: service_healthy
      signal-service:
        condition: service_started
      risk-service:
        condition: service_started
    restart: unless-stopped
    networks: [vixnet]
