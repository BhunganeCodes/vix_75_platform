[project]
name = "visualization-service"
version = "0.1.0"
description = "Plotly chart rendering for strategy, regime and ML explainability"
requires-python = ">=3.12"
dependencies = [
    "vix-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "plotly>=5.22,<7",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
png = ["kaleido>=0.2,<1"]

[tool.uv]
package = false

[tool.uv.sources]
vix-core = { workspace = true }
