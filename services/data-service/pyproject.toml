[project]
name = "data-service"
version = "0.1.0"
description = "VIX75 market data ingestion: MT5 -> TimescaleDB + Redis"
requires-python = ">=3.12"
dependencies = [
    "vix-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6",
]

[tool.uv]
package = false

[tool.uv.sources]
vix-core = { workspace = true }
