[project]
name = "execution-service"
version = "0.1.0"
description = "MT5 order placement with retcode handling and idempotency"
requires-python = ">=3.12"
dependencies = [
    "vix-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<6",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.uv]
package = false

[tool.uv.sources]
vix-core = { workspace = true }
