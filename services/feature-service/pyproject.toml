[project]
name = "feature-service"
version = "0.1.0"
description = "Vectorized indicator/zone computation from the OHLCV stream"
requires-python = ">=3.12"
dependencies = [
    "vix-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<6",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
vix-core = { workspace = true }
