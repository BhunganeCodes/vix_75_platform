[project]
name = "ml-service"
version = "0.1.0"
description = "HMM regime model + LightGBM meta-label training/inference"
requires-python = ">=3.12"
dependencies = [
    "vix-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "hmmlearn>=0.3.2,<0.4",
    "lightgbm>=4.5,<5",
    "scikit-learn>=1.5,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
vix-core = { workspace = true }
