[project]
name = "vix75-platform"
version = "0.1.0"
description = "VIX75 microservices trading platform (FastAPI + TimescaleDB + Redis)"
requires-python = ">=3.12"
dependencies = [
    "mt5>=0.0.3.1",
    "tqdm>=4.66,<5",
    "vix-core",
]

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    # Local MT5 bridge dependency - Windows only; CI (linux) skips it.
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pyarrow>=23.0.1,<24",
    "pyyaml>=6,<7",
    "types-pyyaml>=6",
    "pytest-cov>=5,<7",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.6,<0.9",
    "scipy-stubs>=1.14",
    "testcontainers[postgres]>=4.8,<5",
    "types-psutil",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
vix-core = { workspace = true }

# ------------------------------------------------------------------
# Tooling configuration (single source of truth for CI and local dev)
# ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "TRY",  # exception handling hygiene (TRY003/raise-vanilla off below)
]
ignore = [
    "TRY003", # long messages outside exception class are fine here
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "E501"] # asserts & fake secrets are the point of tests
"scripts/**/*.py" = ["T201"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "MetaTrader5.*",
    "hmmlearn.*",
    "joblib.*",
    "lightgbm.*",
    "scipy.*",
    "sklearn.*",
    "plotly.*",
    "pandas.*",
    "testcontainers.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Each service owns an `app` package, so suites must run per-service
# (cwd=service dir) to avoid module shadowing. Root run covers vix_core.
testpaths = ["packages/vix_core/tests", "tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires Docker (testcontainers); skipped when unavailable",
]
